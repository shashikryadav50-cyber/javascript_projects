<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>Smart Calculator</h1>

        <input
            type="text"
            id="display"
            placeholder="0"
            readonly
        >

        <div class="buttons">

            <button>C</button>
            <button>DEL</button>
            <button>%</button>
            <button>/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>0</button>
            <button>.</button>
            <button>=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
